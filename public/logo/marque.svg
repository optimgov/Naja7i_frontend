<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Naja7i">
  <!-- Le 7 est la lettre ح en arabizi : « naja7i » = نجاحي, « ma réussite ».
       Tracé en géométrie, jamais en <text> : un SVG servi comme fichier ne
       dispose d'aucune police web, et un wordmark en <text> se rendrait dans
       la police système du lecteur — donc différemment partout. -->
  <rect width="32" height="32" rx="7" fill="#0b6b57"/>
  <path d="M9.5 10.5H22.5L14.5 23.5" fill="none" stroke="#d99a16" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
