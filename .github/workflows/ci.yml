name: CI

on:
  push:
    branches: [main]
  pull_request:

# REVUE FRONT-1 : le dépôt frontend n'avait aucune CI applicative — seule la
# publication GitHub Pages était configurée. `npm run typecheck` était rouge
# depuis la livraison, et rien ne le signalait.
jobs:
  qualite:
    name: Typage et compilation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # La version vit dans `.nvmrc`, elle n'est pas recopiée ici : deux
      # chiffres à maintenir en parallèle finissent toujours par diverger, et
      # c'est cette divergence qui laisse un lock écrit par un npm être
      # installé par un autre. `node-version-file` lit le même fichier que le
      # poste de développement.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer Nuxt
        run: npx nuxt prepare

      # Le typage échoue la CI : c'est le défaut relevé par la revue.
      - name: Vérifier le typage
        run: npm run typecheck

      # Le socle d'interface est vérifiable, pas seulement déclaratif : contrastes,
      # présence des jetons dont dépend la zone publique, séparation de l'erreur
      # système et de l'erreur pédagogique. Sort en code 1 sur échec.
      - name: Vérifier les jetons de conception
        run: node docs/design/ui-v3/valider-jetons.mjs

      # Une clé traduite d'un seul côté affiche sa clé brute au lecteur de
      # l'autre langue, et la compilation ne le voit pas.
      # Les frontières de journée ne se prouvent qu'avec une horloge injectable :
      # à l'heure qu'il est, le défaut du BLOC-ZP1-1 était invisible
      # vingt-trois heures sur vingt-quatre. Ce contrôle rejoue les deux minutes
      # qui comptent, et sous deux fuseaux d'hôte opposés.
      - name: Vérifier les échéances (fuseau du candidat)
        run: npm run echeances

      - name: Vérifier les locales et les propriétés logiques
        run: node scripts/verifier-locales.mjs

      - name: Compiler
        run: npm run build
        env:
          API_BASE_URL: http://localhost:8000

      # FRONT-3 — Sept défauts de rendu ne se voient qu'en mesurant un vrai
      # navigateur : contraste, débordement, cible tactile, nombre cassé par
      # l'algorithme bidi. Les écrans d'authentification de FRONT-1 ont été
      # livrés sans CSS de formulaire, et rien ici ne l'a vu pendant deux lots.
      #
      # L'audit ne couvre en CI que les écrans indépendants de l'API : la CI du
      # frontend n'a pas de backend, et auditer un catalogue vide mesurerait son
      # état vide. Le script écrit lui-même la liste de ce qu'il n'a pas couvert.
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      # Attente par `curl` plutôt que par `wait-on` : une dépendance de plus
      # pour une boucle de six lignes ne se justifie pas, et `npx wait-on` la
      # téléchargerait à chaque exécution.
      - name: Servir la compilation
        run: |
          node .output/server/index.mjs &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/fr/connexion; then
              echo "Serveur prêt après ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Le serveur n'a pas répondu en 60 s"; exit 1
        env:
          API_BASE_URL: http://localhost:8000
          NITRO_PORT: 3000

      - name: Revue de rendu (contraste, débordement, cibles, bidi)
        run: npm run audit:ci
